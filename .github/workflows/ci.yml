name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate grok-forge.json and check every fork + upstream exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          d = json.load(open("grok-forge.json"))
          assert d["count"] == len(d["repos"]) > 0
          readme = open("README.md").read()
          bad = []
          for r in d["repos"]:
              for k in ("fork", "upstream", "category", "stars", "license", "pushed_at"):
                  assert r.get(k) not in (None, ""), (r, k)
              assert f"https://github.com/{r['fork']}" in readme, r["fork"]
              for repo in (r["fork"], r["upstream"]):
                  p = subprocess.run(["gh", "api", f"repos/{repo}", "-q", ".full_name"], capture_output=True, text=True)
                  if p.returncode: bad.append(repo)
          print(len(d["repos"]), "repos checked;", len(bad), "missing:", bad)
          sys.exit(1 if bad else 0)
          PY
